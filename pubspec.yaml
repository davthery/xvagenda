name: xvagenda
description: Application mobile pour visualiser les événements du XV de l'Erdre
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Pour accéder aux Google Sheets
  gsheets: ^0.5.0

  # Pour l'accès à l'API Google Calendar (remplacement de Sheets, phase 1-2)
  googleapis: ^11.4.0

  # Pour l'authentification par compte de service Google
  googleapis_auth: ^1.6.0

  # Pour l'affichage du calendrier
  calendar_view: ^1.0.4
  
  # Gestion des dates
  intl: ^0.20.2
  
  # Pour accéder au système de fichiers
  path_provider: ^2.1.1
  
  # Pour la persistance des données
  shared_preferences: ^2.2.2
  
  # Base de données SQLite
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  
  # Icônes Material
  cupertino_icons: ^2.0.0

  # path package
  path: ^1.8.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/logo.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  image_path_android: "assets/images/logo.png"
  image_path_ios: "assets/images/logo.png"
  min_sdk_android: 21
